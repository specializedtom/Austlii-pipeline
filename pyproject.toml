[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "austlii-pipeline"
version = "0.1.0"
description = "Starter pipeline for ingesting AustLII legislation and classifying operative status"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
austlii-pipeline = "src.pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
